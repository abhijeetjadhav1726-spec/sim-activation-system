<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIM Activation Desk</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #202445;
      background: #f4f3ff;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      max-width: 1100px;
      margin: 2.5rem auto;
      padding: 0 1.25rem;
      background:
        radial-gradient(ellipse at 8% 4%, #e8e5ff 0, transparent 34rem),
        radial-gradient(ellipse at 96% 30%, #dff8f4 0, transparent 30rem),
        #f8f8ff;
      min-height: 100vh;
    }
    header, section {
      border: 1px solid #e5e4f2;
      border-radius: 18px;
      padding: 1.5rem;
      margin-bottom: 1.2rem;
      box-shadow: 0 10px 30px #29265a0d;
    }
    header {
      position: relative;
      overflow: hidden;
      padding: 2.1rem 2rem;
      color: white;
      border: 0;
      background: linear-gradient(120deg, #4938b8 0%, #7652d7 54%, #b14cc9 100%);
      box-shadow: 0 16px 35px #6047c333;
    }
    header::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      right: -45px;
      top: -115px;
      border: 35px solid #ffffff1a;
      border-radius: 50%;
      box-shadow: 0 0 0 30px #ffffff0c, 0 0 0 65px #ffffff0a;
    }
    h1 { margin: 0 0 .45rem; font-size: clamp(1.8rem, 4vw, 2.5rem); letter-spacing: -.04em; }
    h2 { margin: 0 0 1.1rem; color: #29264f; font-size: 1.2rem; }
    header .muted { color: #eeeaff; }
    section { background: #ffffffed; }
    section:nth-of-type(1) { border-top: 4px solid #8b6be8; }
    section:nth-of-type(2) { border-top: 4px solid #20b9a4; }
    section:nth-of-type(3) { border-top: 4px solid #f1a640; }
    .muted { color: #777994; }
    .row { display: flex; flex-wrap: wrap; gap: .85rem; align-items: end; }
    label { display: grid; gap: .4rem; color: #555777; font-size: .88rem; font-weight: 650; }
    input, select, button {
      min-height: 42px;
      font: inherit;
      padding: .6rem .8rem;
      border: 1px solid #d9d8e9;
      border-radius: 9px;
      background: #fbfbff;
      color: #29264f;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    input:focus, select:focus { outline: none; border-color: #8065df; box-shadow: 0 0 0 3px #8065df26; }
    button {
      border: 0;
      background: linear-gradient(135deg, #6049cc, #8a55dc);
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px #6049cc30;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 7px 16px #6049cc40; }
    button.secondary { background: #eef0fa; color: #514d78; box-shadow: none; }
    button.secondary:hover { background: #e2e4f5; box-shadow: none; }
    table { width: 100%; border-collapse: collapse; min-width: 650px; }
    th, td { padding: .8rem .7rem; text-align: left; border-bottom: 1px solid #eeedf5; }
    th { color: #777994; background: #f8f7fc; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; }
    tbody tr:hover { background: #fbfaff; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: .75rem; }
    .card {
      display: grid;
      gap: .3rem;
      min-height: 88px;
      padding: .85rem 1rem;
      border: 1px solid transparent;
      border-radius: 12px;
      background: #f0edff;
      color: #5244a5;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .card strong { font-size: 1.7rem; line-height: 1; letter-spacing: -.04em; }
    .card-draft { color: #7253bd; background: #f2edff; border-color: #e5dcff; }
    .card-submitted { color: #b97716; background: #fff6e4; border-color: #f8e6bd; }
    .card-in_review { color: #1687a1; background: #e8f8fc; border-color: #cceef4; }
    .card-activated { color: #16876f; background: #e6f8f1; border-color: #c9eddf; }
    .card-rejected { color: #c04e69; background: #fff0f2; border-color: #f8d9df; }
    #message { min-height: 1.4rem; margin-bottom: 0; color: #b33d5a; font-weight: 600; }
    .actions { display: flex; gap: .4rem; flex-wrap: wrap; }
    .actions button { min-height: 34px; padding: .4rem .65rem; font-size: .82rem; }
    @media (max-width: 700px) {
      body { margin: 1rem auto; padding: 0 .8rem; }
      header, section { padding: 1.15rem; border-radius: 14px; }
      header { padding: 1.7rem 1.3rem; }
      .row > label { flex: 1 1 100%; }
      .row input, .row select { width: 100%; }
      table { font-size: .82rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>SIM Activation Desk</h1>
    <div class="muted">Activation requests, status workflow and daily summary</div>
  </header>
  <section>
    <h2>Summary</h2>
    <div id="dashboard" class="cards" aria-label="Activation summary"></div>
  </section>
  <section>
    <h2 id="form-title">Create activation request</h2>
    <form id="activation-form" class="row">
      <input type="hidden" id="record-id">
      <label>Customer name<input id="customer-name" maxlength="100" required></label>
      <label>MSISDN<input id="msisdn" inputmode="numeric" pattern="[0-9]{10,15}" required></label>
      <label>ICCID<input id="iccid" inputmode="numeric" pattern="[0-9]{18,22}" required></label>
      <button type="submit">Save request</button>
      <button type="button" class="secondary" id="cancel-edit" hidden>Cancel edit</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </section>
  <section>
    <h2>Activation records</h2>
    <form id="search-form" class="row">
      <label>Search customer, MSISDN or ICCID<input id="search-query"></label>
      <label>Status<select id="status-filter"><option value="">All statuses</option>
        <option>DRAFT</option><option>SUBMITTED</option><option>IN_REVIEW</option><option>ACTIVATED</option><option>REJECTED</option>
      </select></label>
      <button type="submit">Search</button>
      <label>Acting role<select id="actor-role"><option>AGENT</option><option>SUPERVISOR</option><option>ADMIN</option></select></label>
    </form>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>ID</th><th>Customer</th><th>MSISDN</th><th>ICCID</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="records"></tbody>
      </table>
    </div>
  </section>
  <script>
    const api = '/api';
    const $ = (id) => document.getElementById(id);
    async function request(path, options = {}) {
      const response = await fetch(api + path, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
      });
      const body = response.status === 204 ? null : await response.json();
      if (!response.ok) throw new Error(body?.error || `Request failed (${response.status})`);
      return body;
    }
    function showError(error) { $('message').textContent = error.message; }
    async function loadDashboard() {
      const counts = await request('/dashboard');
      const statuses = ['DRAFT', 'SUBMITTED', 'IN_REVIEW', 'ACTIVATED', 'REJECTED'];
      $('dashboard').innerHTML = statuses.map(status =>
        `<div class="card card-${status.toLowerCase()}"><strong>${counts[status] || 0}</strong>${status.replace('_', ' ')}</div>`).join('');
    }
    async function loadRecords() {
      const params = new URLSearchParams();
      if ($('search-query').value.trim()) params.set('query', $('search-query').value.trim());
      if ($('status-filter').value) params.set('status', $('status-filter').value);
      const records = await request('/activations?' + params.toString());
      $('records').innerHTML = records.map(record => {
        const buttons = [];
        if (record.status === 'DRAFT') buttons.push(`<button class="secondary" data-edit="${record.id}">Edit</button>`);
        const next = { DRAFT: 'SUBMITTED', SUBMITTED: 'IN_REVIEW', IN_REVIEW: 'ACTIVATED' }[record.status];
        if (next) buttons.push(`<button data-transition="${record.id}" data-next="${next}">${next}</button>`);
        return `<tr><td>${record.id}</td><td>${escapeHtml(record.customerName)}</td><td>${record.msisdn}</td><td>${record.iccid}</td><td>${record.status}</td><td class="actions">${buttons.join('')}</td></tr>`;
      }).join('');
    }
    function escapeHtml(text) {
      const element = document.createElement('span');
      element.textContent = text;
      return element.innerHTML;
    }
    async function refresh() { await Promise.all([loadDashboard(), loadRecords()]); }
    $('activation-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const id = $('record-id').value;
      const payload = { customerName: $('customer-name').value, msisdn: $('msisdn').value, iccid: $('iccid').value };
      try {
        await request(id ? `/activations/${id}` : '/activations', {
          method: id ? 'PUT' : 'POST',
          headers: { 'X-Actor-Role': $('actor-role').value },
          body: JSON.stringify(payload)
        });
        $('message').textContent = 'Activation request saved.';
        resetForm();
        await refresh();
      } catch (error) { showError(error); }
    });
    $('search-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      try { await loadRecords(); } catch (error) { showError(error); }
    });
    $('records').addEventListener('click', async (event) => {
      const editId = event.target.dataset.edit;
      const transitionId = event.target.dataset.transition;
      try {
        if (editId) {
          const record = await request(`/activations/${editId}`);
          $('record-id').value = record.id;
          $('customer-name').value = record.customerName;
          $('msisdn').value = record.msisdn;
          $('iccid').value = record.iccid;
          $('form-title').textContent = `Edit draft #${record.id}`;
          $('cancel-edit').hidden = false;
        } else if (transitionId) {
          await request(`/activations/${transitionId}/status`, {
            method: 'POST',
            headers: { 'X-Actor-Role': $('actor-role').value },
            body: JSON.stringify({ status: event.target.dataset.next })
          });
          $('message').textContent = 'Status updated.';
          await refresh();
        }
      } catch (error) { showError(error); }
    });
    function resetForm() {
      $('activation-form').reset();
      $('record-id').value = '';
      $('form-title').textContent = 'Create activation request';
      $('cancel-edit').hidden = true;
    }
    $('cancel-edit').addEventListener('click', resetForm);
    refresh().catch(showError);
  </script>
</body>
</html>
